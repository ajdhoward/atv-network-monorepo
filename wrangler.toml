# Sandbox target: deploys to atv-core-v2 (workers.dev, no route).
# Production lives in wrangler.production.toml and is deliberately not the default.
#
# The KV namespaces are shared with production on purpose: this Worker only writes
# `guide:latest`, which does not collide with production's `guide:compiled:*` keys,
# and ATV_CONFIG is currently empty in production.
name = "atv-core-v2"
main = "services/atv-core/src/index.ts"
compatibility_date = "2026-09-21"
account_id = "d9491f1ab703e0a99b69919230410f2a"

[vars]
GITHUB_USERNAME = "ajdhoward"
SYSTEM_ENV = "sandbox"

[[kv_namespaces]]
binding = "ATV_CACHE"
id = "7e635f2e4ac44488a336f9d509b63061"

[[kv_namespaces]]
binding = "ATV_CONFIG"
id = "a59048e76fbd47c185bd4fc62fc3111a"

# The guide snapshot (`scheduled()`) fires every 10 minutes. Production has no
# trigger: its Worker is not built from this repo.
[triggers]
crons = ["*/10 * * * *"]

[assets]
directory = "./apps/tv-client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[placement]
mode = "smart"

[observability]
enabled = true
