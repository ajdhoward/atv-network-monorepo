# Sandbox target: deploys to atv-core-v2 (workers.dev, no route).
# Production lives in wrangler.production.toml and is deliberately not the default.
#
# The namespace ids below are production's and are only a placeholder: this Worker
# writes (guide snapshot cron, seeding), so it must not share them. `pnpm kv:staging`
# creates atv-cache-staging/atv-config-staging and rewrites these two blocks; until
# then scripts/check-deploy-target.mjs refuses `pnpm deploy`.
name = "atv-core-v2"
main = "services/atv-core/src/index.ts"
compatibility_date = "2026-09-21"
account_id = "d9491f1ab703e0a99b69919230410f2a"

[vars]
GITHUB_USERNAME = "ajdhoward"
SYSTEM_ENV = "sandbox"

[[kv_namespaces]]
binding = "ATV_CACHE"
id = "7e635f2e4ac44488a336f9d509b63061"

[[kv_namespaces]]
binding = "ATV_CONFIG"
id = "a59048e76fbd47c185bd4fc62fc3111a"

# Per-IP budget for /api/resolve: 300 requests per minute. One TV at a time:
# the busiest legitimate pattern is one prefetch per 350 ms hover debounce
# (~170/minute) while the grid is swept, plus a play request, so 300 leaves
# headroom and still stops a scraper or a runaway loop. 60/minute tripped during
# an ordinary sweep. The limit is enforced by the ATV_LIMITER Durable Object
# below; this binding is the coarse fallback, applied per Cloudflare location
# and cached per isolate, which alone let a 419-request burst through with zero
# 429s. The binding is optional in code, so removing this block disables the
# fallback.
[[ratelimits]]
name = "ATV_RATE_LIMITER"
namespace_id = "4210"

  [ratelimits.simple]
  limit = 300
  period = 60

# Strict limiter for /api/resolve. One Durable Object instance per client key,
# so every location counts against the same window; the window is persisted
# before the decision is returned and an alarm clears it when it ends.
[[durable_objects.bindings]]
name = "ATV_LIMITER"
class_name = "RateLimiter"

# SQLite-backed class: Durable Objects are available on the free plan only in
# this form. The object keeps a single counter, so no schema is involved.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Resolve/ident counters. Analytics Engine creates the dataset on the first write,
# so this binding needs no setup step and the Worker no-ops without it.
[[analytics_engine_datasets]]
binding = "ATV_METRICS"
dataset = "atv_metrics"

# The guide snapshot (`scheduled()`) fires every 10 minutes. Production has no
# trigger: its Worker is not built from this repo.
[triggers]
crons = ["*/10 * * * *"]

# The asset directory carries the TV client at / and the admin CMS at /admin
# (packed by scripts/pack-assets.mjs). The Worker handles /admin itself so it
# can redirect the bare path and serve assets from the same binding.
[assets]
directory = "./apps/tv-client/dist"
# Without an explicit binding name the Worker cannot reach the assets it serves.
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/admin", "/admin/*"]

[placement]
mode = "smart"

[observability]
enabled = true
# 10% of requests is plenty for a personal network; 100% burns the free log
# allowance on /api/guide polls.
head_sampling_rate = 0.1
