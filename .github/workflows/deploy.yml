name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run build:client
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: d9491f1ab703e0a99b69919230410f2a
          packageManager: pnpm
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.toml
      # Verifies what was just deployed. Skipped until a service token exists,
      # because Cloudflare Access answers every unauthenticated path with a redirect.
      - name: Smoke test
        if: ${{ secrets.CF_ACCESS_CLIENT_ID != '' }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm smoke https://atv.acidwurx.org
