name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options: [v2, production]
        default: v2
concurrency:
  group: deploy-${{ github.event.inputs.target || 'verify' }}
  cancel-in-progress: false
jobs:
  # Every push to main is verified. Nothing is deployed automatically: the live
  # atv-core-orchestrator is not built from this repo, so a push must never replace it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Knowledge that lives only in someone's session is lost knowledge: this
      # fails on a dead doc link, an unindexed document, a secret renamed out of
      # the inventory, or a gitignored file that got committed.
      - run: pnpm continuity
      - run: pnpm test
      # build:deploy is client + admin + the pack step the Worker's asset
      # directory depends on, so CI exercises the same build the deploy does.
      - run: pnpm run build:deploy
      # Boots that build in workerd with a fixture lineup, so KV bindings, the
      # asset and /admin routing, the cron snapshot and the Durable Object
      # limiter are exercised on the push instead of after a deploy. No account
      # or remote KV: everything lands in the local .wrangler store.
      - name: Exercise the Worker locally
        run: pnpm run ci:worker
      # The guard itself is covered by scripts/test. It cannot run here: the
      # committed wrangler.toml still carries production's namespace ids as a
      # placeholder and is only patched by kv:staging in the deploy job.
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:deploy
      # The committed wrangler.toml still carries production's namespace ids as a
      # placeholder, so the check below (and the deploy) needs staging ids first.
      # This is idempotent: existing atv-*-staging namespaces are reused.
      - name: Create the sandbox KV namespaces
        if: inputs.target == 'v2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
        run: pnpm kv:staging
      # Fails loudly unless the operator chose the sandbox, or set the override while
      # asking for production on purpose.
      - name: Check deploy target
        env:
          ATV_ALLOW_PROD_DEPLOY: ${{ inputs.target == 'production' && '1' || '0' }}
        run: node scripts/check-deploy-target.mjs ${{ inputs.target == 'production' && 'wrangler.production.toml' || 'wrangler.toml' }}
      # Optional: an operator who keeps the map in a repository secret instead of
      # running wrangler locally. Without the secret this is a no-op, so a deploy
      # never depends on it. It runs before the deploy so a map with a bad id or
      # a non-HTTPS link fails loudly while the running worker is still intact.
      - name: Push the operator stream links
        env:
          ATV_GDRIVE_MAP: ${{ secrets.ATV_GDRIVE_MAP }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
        run: |
          if [ -z "$ATV_GDRIVE_MAP" ]; then
            echo "No ATV_GDRIVE_MAP secret; skipping (resolves fall back to KV)."
            exit 0
          fi
          printf '%s' "$ATV_GDRIVE_MAP" > "$RUNNER_TEMP/gdrive-map.json"
          node scripts/set-gdrive-map.mjs "$RUNNER_TEMP/gdrive-map.json" \
            --config ${{ inputs.target == 'production' && 'wrangler.production.toml' || 'wrangler.toml' }}
      # Optional: the TorBox API token. Piped straight into the Worker secret so it
      # never lands in a file, and skipped when the repository secret is absent.
      - name: Push the TorBox token
        env:
          ATV_TORBOX_API_KEY: ${{ secrets.ATV_TORBOX_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
        run: |
          if [ -z "$ATV_TORBOX_API_KEY" ]; then
            echo "No ATV_TORBOX_API_KEY secret; skipping (mapped TorBox channels answer 502)."
            exit 0
          fi
          printf '%s' "$ATV_TORBOX_API_KEY" | pnpm exec wrangler secret put ATV_TORBOX_API_KEY \
            --config ${{ inputs.target == 'production' && 'wrangler.production.toml' || 'wrangler.toml' }}
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: d9491f1ab703e0a99b69919230410f2a
          packageManager: pnpm
          wranglerVersion: "4.166.0"
          command: deploy --config ${{ inputs.target == 'production' && 'wrangler.production.toml' || 'wrangler.toml' }}
      # Optional: with an ATV_SEED_CONFIG repository secret holding the lineup JSON,
      # the deploy also seeds staging, so the guide is not empty. The secret keeps
      # stream URLs out of this public repo; without it the deploy is still valid.
      - name: Seed the sandbox lineup
        if: inputs.target == 'v2'
        env:
          ATV_SEED_CONFIG: ${{ secrets.ATV_SEED_CONFIG }}
          # seed-kv.mjs shells out to `wrangler kv key put --remote`; the token
          # that wrangler-action used for the deploy step is not inherited here.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
        run: |
          if [ -z "$ATV_SEED_CONFIG" ]; then
            echo "No ATV_SEED_CONFIG secret; skipping seed (smoke allows an empty guide)."
            exit 0
          fi
          printf '%s' "$ATV_SEED_CONFIG" > "$RUNNER_TEMP/atv-seed.json"
          node scripts/seed-kv.mjs --file "$RUNNER_TEMP/atv-seed.json"
      # The sandbox host is not behind Access, so its smoke test can always run.
      # --allow-empty: a first deploy lands on a brand-new, unseeded namespace;
      # content is an operator step, a broken route is not.
      - name: Smoke test (sandbox)
        if: ${{ inputs.target == 'v2' && steps.deploy.outputs.deployment-url != '' }}
        env:
          # Q9: once the household token is enforced, a headerless resolve answers
          # 401 and this step failed on a deploy that worked. Smoke sends the header
          # only when the value is present, so a deployment that has not turned the
          # token on yet still passes, and one that has is proven end to end.
          ATV_DEVICE_TOKEN: ${{ secrets.ATV_DEVICE_TOKEN }}
        run: pnpm smoke ${{ steps.deploy.outputs.deployment-url }} --allow-empty
      # Production only: Cloudflare Access answers unauthenticated paths with a
      # redirect, so the smoke test needs a service token. Secrets cannot appear in
      # an `if:` (GitHub refuses to parse the workflow at all), so the step runs for
      # production and exits early when the token is absent.
      - name: Smoke test (production)
        if: inputs.target == 'production'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "No CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET secret; skipping."
            exit 0
          fi
          pnpm smoke https://atv.acidwurx.org
