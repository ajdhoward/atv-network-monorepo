name: Provision KV

# One-off provisioning for a Workers KV namespace this repository does not use.
#
# It runs on `CF_API_TOKEN`, which already holds Workers KV Storage: Edit —
# `deploy.yml` puts remote KV keys with it — so creating a namespace needs no new
# scope and no second secret. workflow_dispatch only: nothing here runs on a push.
# Delete this file once the namespace exists if you would rather not keep an
# unused write path around.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Namespace name
        required: true
        default: mcp-onboard-ONBOARD_KV

permissions:
  contents: read

concurrency:
  group: provision-kv
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          # Re-running must not create a second namespace with the same title.
          npx --yes wrangler@4.166.0 kv namespace list > /tmp/namespaces.json
          id=$(node -e 'const list = require("/tmp/namespaces.json"); const hit = list.find((ns) => ns.title === process.env.NAME); if (hit) process.stdout.write(hit.id)')
          if [ -z "$id" ]; then
            npx --yes wrangler@4.166.0 kv namespace create "$NAME" > /tmp/create.txt
            cat /tmp/create.txt
            id=$(grep -oE '[0-9a-f]{32}' /tmp/create.txt | head -1)
          else
            echo "$NAME already exists"
          fi
          test -n "$id"
          echo "namespace $NAME = $id"
          {
            echo "### KV namespace"
            echo
            echo "| name | id |"
            echo "| --- | --- |"
            echo "| \`$NAME\` | \`$id\` |"
          } >> "$GITHUB_STEP_SUMMARY"
