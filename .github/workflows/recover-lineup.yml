name: Recover lineup
# Temporary: reads the production guide snapshot with the repository's Cloudflare
# token, because the KV read paths available outside CI truncate the value.
# Prints channel metadata only (id/name/number/category/country); no stream URLs.
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dump channel metadata from guide:backup-grid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9491f1ab703e0a99b69919230410f2a
        run: |
          set -euo pipefail
          npx --yes wrangler@4.166.0 kv key get --remote \
            --namespace-id 7e635f2e4ac44488a336f9d509b63061 "guide:backup-grid" \
            > "$RUNNER_TEMP/backup-grid.json"
          echo "bytes: $(wc -c < "$RUNNER_TEMP/backup-grid.json")"
          node - "$RUNNER_TEMP/backup-grid.json" <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync(process.argv[2], "utf8");
          const start = text.indexOf("{");
          const end = text.lastIndexOf("}");
          const parsed = JSON.parse(text.slice(start, end + 1));
          const body = parsed.value ?? parsed;
          const rows = (body.channels ?? []).map((c) => ({
            id: c.id,
            name: c.name,
            number: c.number,
            category: c.category,
            country: c.country,
          }));
          console.log("channelCount:", body.channelCount, "rows:", rows.length);
          for (const row of rows) console.log("ROW " + JSON.stringify(row));
          NODE
